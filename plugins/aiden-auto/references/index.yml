# /auto Skill Index — Chapter Routing Database
# 도서관 카탈로그: 사용자 요구 → 어떤 chapter를 읽을지 결정
# 갱신: 2026-05-04 v27.2 (OMC 영감 5개 패턴: XML + Multi-perspective + Pipeline + Cleanup + Specialist agents)

version: "27.2.0"
purpose: "Phase -2 Triage가 사용자 요구를 분석한 후, 이 index를 lookup하여 해당 chapter만 로딩"

# ─────────────────────────────────────────────────────────────
# 카테고리 라우팅 — 키워드 기반 1차 분류
# ─────────────────────────────────────────────────────────────

categories:

  DOC:
    description: "기획서 / PRD / spec 작성 / 문서화"
    keywords:
      - 기획
      - 기획서
      - PRD
      - spec
      - 명세
      - 문서
      - 정리
      - 작성
    chapter: "chapter-doc.md"
    agent_team:
      - planner
      - writer
      - critic
      - architect
    typical_phase_path: ["-2", "-1", "0", "1", "4"]
    skip_phases: ["2", "3"]

  CODE:
    description: "기능 구현 / 수정 / 추가 / 리팩토링"
    keywords:
      - 구현
      - 추가
      - 만들어
      - fix
      - 수정
      - refactor
      - 리팩토링
      - build
      - 코드
      - 기능
    chapter: "chapter-code.md"
    agent_team:
      - executor
      - architect
      - code-reviewer
      - qa-tester
      - security-reviewer  # NEW v27.2 (Phase 3 multi-perspective)
      - test-engineer      # NEW v27.2 (Phase 1 test strategy)
      - verifier           # NEW v27.2 (Phase 3.5 fresh evidence)
    typical_phase_path: ["-2", "-1", "0", "1", "2", "3", "3.5", "4", "cleanup"]
    skip_phases: []

  QA:
    description: "테스트 / E2E / 검증 / 회귀 검사"
    keywords:
      - 테스트
      - test
      - E2E
      - 검증
      - QA
      - regression
      - 회귀
      - 품질
    chapter: "chapter-qa.md"
    agent_team:
      - qa-tester
      - architect
      - executor
    typical_phase_path: ["-2", "-1", "0", "3", "4"]
    skip_phases: ["1", "2"]

  ITERATION:
    description: "반복 cycle / drift 검증 / 미구현 list 처리 / hot-swap 진화"
    keywords:
      - 반복
      - cycle
      - 미구현
      - drift
      - 누적
      - 검증 반복
      - iteration
      - iterate
    chapter: "chapter-iteration.md"
    agent_team:
      - iteration-curator-a
      - iteration-curator-b
      - iteration-drift-reconciler
      - executor
      - architect
    typical_phase_path: ["-2", "-1", "0", "1", "2", "3", "iteration-loop", "4"]
    skip_phases: []
    notes: "구 /iteration 스킬 흡수. hot-swap curator + drift detection."

  RESEARCH:
    description: "조사 / 분석 / 비교 / 최신 트렌드"
    keywords:
      - 조사
      - 리서치
      - research
      - 분석
      - 비교
      - 트렌드
      - 알아봐
      - 찾아봐
    chapter: "chapter-research.md"
    agent_team:
      - researcher
      - analyst
      - writer
    typical_phase_path: ["-2", "-1", "0", "1", "4"]
    skip_phases: ["2", "3"]

  MEDIA:
    description: "UI 목업 / 영상 / 이미지 / 디자인 (방송 도메인 친화)"
    keywords:
      - 목업
      - mockup
      - UI
      - 디자인
      - 화면
      - 와이어프레임
      - 영상
      - 이미지
      - 스크린샷
    chapter: "chapter-media.md"
    agent_team:
      - designer
      - writer
      - executor
    typical_phase_path: ["-2", "-1", "0", "1", "2", "4"]
    skip_phases: ["3"]

  HARNESS:
    description: "외부 framework 추적 / 자가개선 사이클 운영 (v28.3 신규)"
    keywords: [harness, watcher, "외부 framework", "framework 업데이트"]
    chapter: "chapter-harness.md"
    agent_team: [harness-watcher, harness-critic, harness-applier, cc-version-researcher]
    typical_phase_path: ["-2", "0", "4"]
    skip_phases: ["1", "2", "3"]

# ─────────────────────────────────────────────────────────────
# 모호성 패턴 — Triage가 감지하면 명확화 질문
# ─────────────────────────────────────────────────────────────

ambiguity_patterns:

  vague_aesthetic:
    patterns: ["예쁘게", "깔끔하게", "느낌있게", "세련되게", "모던하게"]
    response: "감각 표현 감지. 3개 참고 예시 제시 후 1회 확인."

  implicit_assumption:
    patterns: ["당연히", "기본적으로", "보통", "그냥"]
    response: "암묵 가정 추출 후 '이렇게 가정했습니다' 1줄 확인."

  scope_unclear:
    patterns: ["다", "전부", "모두", "여러", "몇 개"]
    response: "정확한 범위/개수 확인 1회."

  feeling_rejection:
    patterns: ["뭔가 이상", "어색", "별로", "다른 느낌"]
    response: "critic 재검토 트리거 → 가설 3개 → 사용자 선택."

  technology_indifferent:
    patterns: ["그냥 되게만", "알아서", "아무거나"]
    response: "trade-off Claude 자율 결정. 결과만 비유로 보고."

# ─────────────────────────────────────────────────────────────
# Phase 라이브러리 — 각 phase의 reference 파일
# ─────────────────────────────────────────────────────────────

phase_references:
  "-2": "triage.md"  # NEW v27.0 — Requirement Triage
  "-1": "phase-minus-1-context-detect.md"
  "-1.5": "self-evaluation-gate.md"
  "0": "common.md"
  "1": "phase-1-plan.md"
  "2": "phase-2-build.md"
  "3": "phase-3-verify.md"
  "4": "phase-4-close.md"

  # 옵션/특수 reference
  options: "options-handlers.md"
  adaptive: "adaptive-phase-selection.md"
  profiles: "project-profiles.md"
  paradigm: "multi-paradigm-support.md"
  kpi: "kpi-pluggability.md"
  tools: "tool-integration.md"

# ─────────────────────────────────────────────────────────────
# 평문 트리거 화이트리스트 — 단순 read는 제외
# ─────────────────────────────────────────────────────────────

plain_text_triggers:

  enabled_patterns:
    # 코드 작업
    - "구현해"
    - "추가해"
    - "수정해"
    - "fix"
    - "만들어"
    - "리팩토링"
    # 기획 작업
    - "기획해"
    - "PRD"
    - "spec 작성"
    - "정리해"
    # QA
    - "테스트"
    - "검증해"
    # 반복
    - "반복"
    - "cycle"
    # HARNESS chapter (v28.3 신규)
    - "harness 상태"
    - "harness 체크"
    - "외부 framework 업데이트"

  disabled_patterns:
    # 단순 질문/탐색 — /auto 발동 안 함
    - "뭐야"
    - "어디야"
    - "보여줘"
    - "읽어줘"
    - "확인"
    - "?"
    # Magic Word — 빠른 실행
    - "!quick"
    - "!just"
    - "!hotfix"

# ─────────────────────────────────────────────────────────────
# Iteration Loop (구 /iteration 흡수)
# ─────────────────────────────────────────────────────────────

iteration_loop:
  trigger: "category == ITERATION OR --mode=iteration OR e2e_failed"
  exit_criteria:
    e2e_zero_error: true
    architect_approve: true
    OR_user_explicit_stop: ["멈춰", "stop", "ok"]
    OR_circuit_breaker: 5  # 5회 동일 실패 시 사용자 보고
  hot_swap:
    enabled: true
    cadence: "phase 종료 시"
    log: "curators/rotation_log.md"
  drift_check:
    script: "scripts/spec_drift_check.py"
    threshold: 0.9

# ─────────────────────────────────────────────────────────────
# Legacy redirects (호환성)
# ─────────────────────────────────────────────────────────────

legacy_aliases:
  "/iteration": "/auto --mode=iteration"
  "iterate": "/auto --mode=iteration"
  "cycle": "/auto --mode=iteration"
  "/aiden-auto:auto": "/auto"
  "ralph": "/auto"
  "ulw": "/auto"
  "ultrawork": "/auto"
  "autopilot": "/auto"
